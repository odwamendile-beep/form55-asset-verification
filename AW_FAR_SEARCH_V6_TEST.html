<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Form 55 V8.5 | Amatola Water</title><link rel="stylesheet" href="https://js.arcgis.com/4.32/esri/themes/light/main.css"><script src="https://js.arcgis.com/4.32/"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px Arial,sans-serif;color:#18392e;background:#eaf0e9}button,select,input{font:inherit}button{cursor:pointer}header{background:#126043;color:#fff;padding:11px 15px}header strong{font-size:17px}header small{display:block;margin-top:3px}#auth{padding:9px 14px;background:white;display:flex;align-items:center;gap:12px;min-height:43px}#auth button,.primary{background:#126043;color:white;border:0;border-radius:7px;padding:9px 12px}#filters{display:flex;gap:10px;padding:10px 12px;background:#fff;box-shadow:0 2px 6px #0002;position:relative;z-index:2}#filters label{flex:1;min-width:0;font-size:12px;font-weight:bold}select{display:block;width:100%;margin-top:5px;border:1px solid #b8c9be;border-radius:7px;background:white;padding:11px 8px;color:#18392e}#mapWrap{position:relative;height:calc(100dvh - 168px);min-height:280px}#map{height:100%;width:100%}#clearFilters{position:absolute;top:14px;right:14px;z-index:6;border:1px solid #b6c9c0;background:#fff;color:#126043;border-radius:9px;padding:10px 13px;font-weight:bold;box-shadow:0 2px 10px #0004;min-height:44px}#gps{position:absolute;bottom:20px;right:14px;z-index:3;border:0;background:white;color:#126043;border-radius:50%;height:46px;width:46px;font-size:24px;box-shadow:0 2px 10px #0005}#gpsStatus{position:absolute;bottom:70px;right:12px;max-width:230px;background:white;padding:7px;border-radius:6px;display:none}#facilityPanel{position:absolute;left:10px;right:10px;bottom:12px;max-height:68%;overflow:auto;z-index:5;background:white;border-radius:13px;box-shadow:0 5px 20px #0005;padding:13px;display:none}#facilityPanel.open{display:block;animation:panelRise .32s cubic-bezier(.2,.8,.2,1) both}@keyframes panelRise{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}#facilityPanel h2{font-size:17px;margin:0 40px 5px 0}#facilityPanel .meta{color:#456456;font-size:12px;margin-bottom:10px}#closePanel{position:absolute;right:10px;top:10px;border:0;border-radius:50%;background:#e9f1eb;height:30px;width:30px;font-size:20px}#farSearch{width:100%;border:1px solid #b8c9be;border-radius:7px;padding:11px;margin:7px 0}#assetList{max-height:34vh;overflow:auto}.asset{padding:10px;border:1px solid #d8e3dc;border-radius:8px;margin:6px 0}.asset button{background:#e5f0e8;color:#126043;border:0;padding:8px;border-radius:7px;margin-top:7px}.asset small{display:block;color:#52675c;margin-top:4px}.assetDetail{background:#f1f7f2;border-radius:9px;padding:11px;margin-top:10px}.assetDetail dl{display:grid;grid-template-columns:110px 1fr;gap:5px;margin:10px 0}.assetDetail dt{font-weight:bold}.assetDetail dd{margin:0;overflow-wrap:anywhere}.assetDetail img{max-width:140px;max-height:120px;object-fit:cover;margin:4px;border-radius:5px}.assetDetail a{display:inline-block;margin:6px 0;color:#126043;font-weight:bold}.muted{color:#5d7165;font-size:12px}.hidden{display:none!important}@media(min-width:850px){#facilityPanel{left:auto;width:440px;right:16px;max-height:82%}#mapWrap{height:calc(100dvh - 163px)}}
#verificationDrawer{position:fixed;inset:0 0 0 auto;width:min(100%,480px);z-index:100;background:#f8faf8;box-shadow:-8px 0 30px #0006;transform:translateX(105%);transition:transform .3s ease;display:flex;flex-direction:column;color:#18392e}#verificationDrawer.open{transform:translateX(0)}#drawerShade{position:fixed;inset:0;background:#0007;z-index:99;display:none}#drawerShade.open{display:block}#drawerTop{padding:15px;background:#126043;color:white;display:flex;align-items:center;justify-content:space-between;gap:12px}#drawerTop button{background:#ffffff25;border:1px solid #ffffff66;border-radius:8px;color:white;font-size:23px;padding:3px 12px}#drawerBody{overflow:auto;padding:16px;flex:1}#drawerBody h3{margin:16px 0 8px}#drawerBody dl{display:grid;grid-template-columns:105px 1fr;gap:8px}#drawerBody dt{font-weight:bold}#drawerBody dd{margin:0;overflow-wrap:anywhere}.photoGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.photoGrid a{display:block}.photoGrid img{width:100%;height:125px;object-fit:cover;border-radius:8px}.verifyField{display:block;margin:13px 0;font-weight:bold}.verifyField input,.verifyField select,.verifyField textarea{display:block;width:100%;margin-top:6px;border:1px solid #b8c9be;border-radius:8px;padding:10px;background:white;color:#18392e}.verifyField textarea{min-height:76px}.verifyField input[type=file]{font-weight:normal}.drawerNote{background:#fff4d9;border-radius:8px;padding:11px;line-height:1.5;margin:12px 0}.drawerButton{border:0;border-radius:8px;padding:11px 14px;background:#126043;color:white;margin:7px 7px 7px 0}.drawerButton.secondary{background:#e3ede6;color:#126043}@media(min-width:850px){#verificationDrawer{width:480px}}
</style></head><body>
<header><strong>AMATOLA WATER</strong><small>Form 55 V8.5 | Facility Asset Verification</small></header>
<div id="auth"><span id="notice">Sign in to access the private asset register.</span><button id="login" class="primary">Sign in</button><button id="logout" class="hidden">Sign out</button></div>
<div id="app" class="hidden"><div id="filters"><label>Scheme<select id="scheme"><option value="">All schemes</option></select></label><label>Facility<select id="facility"><option value="">Select facility</option></select></label></div><div id="mapWrap"><div id="map"></div><button id="clearFilters" type="button" title="Clear scheme, facility and FAR filters" aria-label="Clear all filters">↺ Clear</button><button id="gps" aria-label="Find my location" title="My location">◎</button><div id="gpsStatus"></div><section id="facilityPanel" aria-label="Facility and asset details"><button id="closePanel" aria-label="Close facility details">×</button><h2 id="facilityName"></h2><div class="meta" id="facilityMeta"></div><input id="farSearch" placeholder="Search FAR number, type or description" aria-label="Search FAR components"><div id="assetList"></div><div id="assetDetail"></div></section></div></div><div id="drawerShade"></div><aside id="verificationDrawer" aria-label="Component verification" aria-hidden="true"><div id="drawerTop"><strong id="drawerTitle">FAR component</strong><button id="drawerClose" aria-label="Close component panel">×</button></div><div id="drawerBody"></div></aside>
<script>
'use strict';
const CLIENT_ID='StEmFuelJqt2kLlL';
const REDIRECT='https://odwamendile-beep.github.io/form55-asset-verification/AW_FAR_SEARCH_V6_TEST.html';
const BASE='https://services.arcgis.com/C6rxPmErTlCKv9Qe/arcgis/rest/services/AW_Asset_Verification_Field_2026/FeatureServer';
const PORTAL='https://www.arcgis.com';
const $=id=>document.getElementById(id),str=v=>String(v??''),norm=v=>str(v).trim().toLowerCase();
let token=null,expiry=0,facilities=[],components=[],selected=null,view=null,markers=null,locationLayer=null,selectionHalo=null,Graphic=null,Point=null,Circle=null,attachmentSeq=0,photoUrls=[];
function login(){const state=crypto.randomUUID();sessionStorage.setItem('aw_far_oauth_state',state);location.href=PORTAL+'/sharing/rest/oauth2/authorize?'+new URLSearchParams({client_id:CLIENT_ID,response_type:'token',redirect_uri:REDIRECT,expiration:'120',state});}
$('login').onclick=login;
$('logout').onclick=()=>{sessionStorage.removeItem('aw_far_auth');location.href=REDIRECT;};
function restore(){const h=new URLSearchParams(location.hash.slice(1));if(h.has('access_token')){if(h.get('state')!==sessionStorage.getItem('aw_far_oauth_state'))throw Error('Login state verification failed');token=h.get('access_token');expiry=Date.now()+Number(h.get('expires_in')||0)*1000;sessionStorage.setItem('aw_far_auth',JSON.stringify({token,expiry}));sessionStorage.removeItem('aw_far_oauth_state');history.replaceState(null,'',location.pathname);}else{const saved=JSON.parse(sessionStorage.getItem('aw_far_auth')||'null');if(saved?.expiry>Date.now()+60000){token=saved.token;expiry=saved.expiry;}}}
async function query(layer,params){const r=await fetch(BASE+'/'+layer+'/query',{method:'POST',body:new URLSearchParams({f:'json',token,...params}),cache:'no-store'});if(!r.ok)throw Error('ArcGIS HTTP '+r.status);const j=await r.json();if(j.error)throw Error(j.error.message||'ArcGIS query error');return j;}
async function all(layer){const ids=await query(layer,{where:'1=1',returnIdsOnly:'true'}),res=[];for(let i=0;i<(ids.objectIds||[]).length;i+=150){const j=await query(layer,{objectIds:ids.objectIds.slice(i,i+150).join(','),outFields:'*',returnGeometry:layer===0?'true':'false',outSR:'4326'});res.push(...(j.features||[]).map(f=>({...f.attributes,_geometry:f.geometry})));}return res;}
function id(f){return norm(f.Facility_ID||f.Facility_GlobalID||f.GlobalID);}
function componentFacilityId(a){return norm(a.Facility_ID||a.Facility_GlobalID);}
function assets(f){return components.filter(a=>componentFacilityId(a)===id(f));}
function verified(a){return ['verified','complete','completed'].includes(norm(a.Verification_Status||a.Final_Result))||a.Completion_Flag===1||norm(a.Completion_Flag)==='yes';}
function geo(f){const g=f._geometry;if(g&&Number.isFinite(Number(g.x))&&Number.isFinite(Number(g.y)))return {longitude:Number(g.x),latitude:Number(g.y)};const x=Number(f.Longitude),y=Number(f.Latitude);return Number.isFinite(x)&&Number.isFinite(y)?{longitude:x,latitude:y}:null;}
function schemeFacilities(){return facilities.filter(f=>!$('scheme').value||str(f.Scheme)===$('scheme').value);}
function fillFacilities(){const dropdown=$('facility'),value=selected?id(selected):'';dropdown.replaceChildren(new Option('Select facility',''));for(const f of schemeFacilities().sort((a,b)=>str(a.Facility_Name).localeCompare(str(b.Facility_Name))))dropdown.add(new Option(f.Facility_Name||f.Facility_ID,id(f)));dropdown.value=value;}
function paint(){
 if(!markers)return;
 markers.removeAll();
 if(selectionHalo)selectionHalo.removeAll();
 for(const f of (selected?[selected]:schemeFacilities())){
  const p=geo(f);if(!p)continue;
  const active=!!selected&&id(selected)===id(f);
  const list=assets(f),done=list.filter(verified).length;
  const point=new Point(p);
  if(active&&selectionHalo){
   // Separate larger translucent halo leaves the facility marker easy to tap.
   selectionHalo.add(new Graphic({geometry:point,symbol:{type:'simple-marker',style:'circle',size:36,color:[29,132,255,0.13],outline:{color:[38,151,255,0.55],width:3}}}));
   selectionHalo.add(new Graphic({geometry:point,symbol:{type:'simple-marker',style:'circle',size:23,color:[31,137,255,0.17],outline:{color:[90,190,255,0.85],width:2}}}));
  }
  markers.add(new Graphic({geometry:point,symbol:{type:'simple-marker',style:'circle',size:active?14:8,color:active?'#087bff':list.length&&done===list.length?'#20864f':done?'#e3a432':'#c34a3d',outline:{color:'#fff',width:active?2.5:1.2}},attributes:{fid:id(f)}}));
 }
}
function zoomTo(list){if(!view)return;const pts=list.map(geo).filter(Boolean);if(!pts.length)return;if(pts.length===1)view.goTo({center:[pts[0].longitude,pts[0].latitude],zoom:17}).catch(()=>{});else view.goTo(pts.map(p=>new Point(p)),{padding:65}).catch(()=>{});}
function clearDetail(){closeDrawer();attachmentSeq++;photoUrls.forEach(u=>URL.revokeObjectURL(u));photoUrls=[];$('assetDetail').replaceChildren();}
function chooseFacility(f,zoom){const same=selected&&id(selected)===id(f);selected=same?null:f;clearDetail();$('farSearch').value='';$('facilityPanel').classList.toggle('open',!!selected);if(selected){$('scheme').value=str(selected.Scheme||'');$('facilityName').textContent=selected.Facility_Name||'Facility';renderAssets();}fillFacilities();paint();if(zoom&&selected)zoomTo([selected]);}
function renderAssets(){if(!selected)return;const list=assets(selected),done=list.filter(verified).length;$('facilityMeta').textContent=list.length+' FAR components · '+done+' verified';const term=norm($('farSearch').value),box=$('assetList');box.replaceChildren();const filtered=list.filter(a=>!term||[a.FAR_ID,a.ComponentType,a.AssetName,a.AssetType,a.AssetGroupName,a.Building,a.Floor,a.Room].some(v=>norm(v).includes(term)));if(!filtered.length){box.textContent='No matching FAR components.';return;}for(const a of filtered){const card=document.createElement('div');card.className='asset';const title=document.createElement('strong');title.textContent=a.FAR_ID||'FAR number unavailable';const sub=document.createElement('small');sub.textContent=[a.ComponentType||a.AssetType||a.AssetName||'Component',a.Building&&'Building '+a.Building,a.Floor&&'Floor '+a.Floor,a.Room&&'Room '+a.Room].filter(Boolean).join(' · ');const btn=document.createElement('button');btn.textContent='View details and verification';btn.onclick=()=>openAsset(a);card.append(title,sub,btn);box.append(card);}}
function addText(parent,tag,text){const e=document.createElement(tag);e.textContent=str(text);parent.append(e);return e;}
function closeDrawer(){attachmentSeq++;photoUrls.forEach(u=>URL.revokeObjectURL(u));photoUrls=[];$('verificationDrawer').classList.remove('open');$('drawerShade').classList.remove('open');$('verificationDrawer').setAttribute('aria-hidden','true');}
$('drawerClose').onclick=closeDrawer;$('drawerShade').onclick=closeDrawer;
function field(parent,title,kind,options){const label=document.createElement('label');label.className='verifyField';label.textContent=title;let control;if(kind==='select'){control=document.createElement('select');control.add(new Option('Select…',''));for(const value of options||[])control.add(new Option(value,value));}else{control=document.createElement(kind==='textarea'?'textarea':'input');if(kind!=='textarea')control.type=kind;}label.append(control);parent.append(label);return control;}
async function openAsset(a){
 closeDrawer();const seq=attachmentSeq,box=$('drawerBody');box.replaceChildren();$('drawerTitle').textContent=a.FAR_ID||'FAR component';$('verificationDrawer').classList.add('open');$('drawerShade').classList.add('open');$('verificationDrawer').setAttribute('aria-hidden','false');
 addText(box,'h3','Component details');const dl=document.createElement('dl');for(const [label,value] of [['FAR number',a.FAR_ID],['Description',a.AssetName||a.AssetGroupName],['Component',a.ComponentType||a.AssetType],['Building',a.Building],['Floor',a.Floor],['Room',a.Room],['Verification',a.Verification_Status||a.Final_Result||a.Completion_Flag]]){addText(dl,'dt',label);addText(dl,'dd',value||'Not recorded');}box.append(dl);
 addText(box,'h3','Historical photographs');const note=addText(box,'p','Loading existing photographs…');note.className='muted';const photos=document.createElement('div');photos.className='photoGrid';box.append(photos);
 const oid=a.OBJECTID??a.ObjectID;
 if(oid==null)note.textContent='Historical photographs unavailable: no component Object ID.';
 else try{const r=await fetch(BASE+'/1/'+encodeURIComponent(oid)+'/attachments',{method:'POST',body:new URLSearchParams({f:'json',token})});const j=await r.json();if(j.error)throw Error(j.error.message);if(seq!==attachmentSeq)return;const imgs=(j.attachmentInfos||[]).filter(i=>/^image\//.test(i.contentType||'')||/\.(jpg|jpeg|png|webp)$/i.test(i.name||''));note.textContent=imgs.length?imgs.length+' existing photograph(s)':'No historical photographs on this component.';for(const i of imgs){const res=await fetch(BASE+'/1/'+encodeURIComponent(oid)+'/attachments/'+i.id+'?'+new URLSearchParams({token}));if(!res.ok)throw Error('Photo HTTP '+res.status);const url=URL.createObjectURL(await res.blob());if(seq!==attachmentSeq){URL.revokeObjectURL(url);return;}photoUrls.push(url);const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener';const img=document.createElement('img');img.src=url;img.alt=i.name||'Historical asset photograph';link.append(img);photos.append(link);}}catch(e){if(seq===attachmentSeq)note.textContent='Could not load photographs: '+e.message;}
 if(seq!==attachmentSeq)return;
 addText(box,'h3','Verification — draft');const warning=addText(box,'p','This is a draft interface only. It does not submit or update the ArcGIS record. The exact Survey123 fields, domains and attachment rules must be checked before enabling saving.');warning.className='drawerNote';
 const condition=field(box,'Asset condition','select',['Good','Fair','Poor','Not assessed']);const operation=field(box,'Operational status','select',['Operational','Not operational','Unknown']);const remarks=field(box,'Remarks','textarea');
 addText(box,'h3','New verification photographs');const uploads=[field(box,'1. Surroundings / location context','file'),field(box,'2. System / connected equipment','file'),field(box,'3. Close-up FAR asset','file')];for(const u of uploads){u.accept='image/*';u.setAttribute('capture','environment');}
 const draft=document.createElement('button');draft.className='drawerButton';draft.textContent='Download draft notes';draft.onclick=()=>{const data={FAR_ID:a.FAR_ID,Facility_Name:selected?.Facility_Name,condition:condition.value,operational_status:operation.value,remarks:remarks.value,photos_selected:uploads.map(u=>u.files?.[0]?.name||null),warning:'Draft only. No ArcGIS changes or photographs uploaded.'};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='Form55_Draft_'+str(a.FAR_ID||'component').replace(/[^a-z0-9_-]/gi,'_')+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};box.append(draft);
 if(a.Survey123_Edit_URL){const link=document.createElement('a');link.href=a.Survey123_Edit_URL;link.target='_blank';link.rel='noopener';link.className='drawerButton secondary';link.textContent='Existing Survey123 record (optional)';box.append(link);}
}
function clearAllFilters(){
 selected=null;
 clearDetail();
 $('scheme').value='';
 $('farSearch').value='';
 $('facilityPanel').classList.remove('open');
 fillFacilities();
 $('facility').value='';
 paint();
 zoomTo(facilities);
}
$('clearFilters').onclick=clearAllFilters;
$('scheme').onchange=()=>{selected=null;clearDetail();$('facilityPanel').classList.remove('open');fillFacilities();paint();zoomTo(schemeFacilities());};
$('facility').onchange=()=>{const f=facilities.find(f=>id(f)===$('facility').value);if(f)chooseFacility(f,true);else if(selected)chooseFacility(selected,false);};
$('farSearch').oninput=renderAssets;
$('closePanel').onclick=()=>{if(selected)chooseFacility(selected,false);};
$('gps').onclick=()=>{
 const status=$('gpsStatus');status.style.display='block';status.textContent='Locating…';
 if(!navigator.geolocation){status.textContent='GPS not supported.';return;}
 navigator.geolocation.getCurrentPosition(p=>{
  if(!view||!locationLayer||!Graphic||!Point){status.textContent='Map is still loading.';return;}
  const pt=new Point({longitude:p.coords.longitude,latitude:p.coords.latitude});
  const accuracy=Math.max(0,Number(p.coords.accuracy)||0);
  locationLayer.removeAll();
  // Plain GPS dot only: no halo, glow, or accuracy ring.
  locationLayer.add(new Graphic({geometry:pt,symbol:{type:'simple-marker',style:'circle',size:11,color:'#1677ff',outline:{color:'#ffffff',width:2}}}));
  status.textContent='Your location · ±'+Math.round(accuracy)+' m';
  view.goTo({center:pt,zoom:Math.max(view.zoom,16)},{duration:650}).catch(()=>{});
 },e=>{status.textContent='GPS: '+e.message;},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
};
function initMap(){return new Promise((resolve,reject)=>{require(['esri/Map','esri/views/MapView','esri/layers/GraphicsLayer','esri/Graphic','esri/geometry/Point','esri/geometry/Circle'],(Map,MapView,GraphicsLayer,G,P,C)=>{Graphic=G;Point=P;Circle=C;selectionHalo=new GraphicsLayer({title:'Selected facility highlight'});markers=new GraphicsLayer({title:'Facilities'});locationLayer=new GraphicsLayer({title:'My GPS location'});view=new MapView({container:'map',map:new Map({basemap:'satellite',layers:[selectionHalo,markers,locationLayer]}),center:[27.3,-32.9],zoom:8,popupEnabled:false});view.on('click',event=>{let best=null,dist=26*26;markers.graphics.forEach(g=>{const s=view.toScreen(g.geometry);if(!s)return;const d=(s.x-event.x)**2+(s.y-event.y)**2;if(d<=dist){best=g;dist=d;}});if(best){const f=facilities.find(f=>id(f)===best.attributes.fid);if(f)chooseFacility(f,false);}});view.when(resolve,reject);},reject);});}
async function start(){try{restore();if(!token||expiry<=Date.now()+60000)return;$('login').classList.add('hidden');$('logout').classList.remove('hidden');$('notice').textContent='Loading asset register…';[facilities,components]=await Promise.all([all(0),all(1)]);for(const s of [...new Set(facilities.map(f=>str(f.Scheme)).filter(Boolean))].sort())$('scheme').add(new Option(s,s));$('app').classList.remove('hidden');fillFacilities();await initMap();paint();$('notice').textContent=facilities.length+' facilities loaded';}catch(e){$('notice').textContent='Could not load: '+e.message;console.error(e);}}
start();
</script></body></html>
