<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Amatola Water | Form 55</title><link rel="stylesheet" href="https://js.arcgis.com/4.32/esri/themes/light/main.css"><script src="https://js.arcgis.com/4.32/"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px Arial,sans-serif;color:#18392e;background:#eaf0e9}button,select,input{font:inherit}button{cursor:pointer}header{background:#126043;color:#fff;padding:11px 15px}header strong{font-size:17px}header small{display:block;margin-top:3px}#auth{padding:9px 14px;background:white;display:flex;align-items:center;gap:12px;min-height:43px}#auth button,.primary{background:#126043;color:white;border:0;border-radius:7px;padding:9px 12px}#filters{display:flex;gap:10px;padding:10px 12px;background:#fff;box-shadow:0 2px 6px #0002;position:relative;z-index:2}#filters label{flex:1;min-width:0;font-size:12px;font-weight:bold}select{display:block;width:100%;margin-top:5px;border:1px solid #b8c9be;border-radius:7px;background:white;padding:11px 8px;color:#18392e}#mapWrap{position:relative;height:calc(100dvh - 168px);min-height:280px}#map{height:100%;width:100%}#gps{position:absolute;bottom:20px;right:14px;z-index:3;border:0;background:white;color:#126043;border-radius:50%;height:46px;width:46px;font-size:24px;box-shadow:0 2px 10px #0005}#gpsStatus{position:absolute;bottom:70px;right:12px;max-width:230px;background:white;padding:7px;border-radius:6px;display:none}#facilityPanel{position:absolute;left:10px;right:10px;bottom:12px;max-height:68%;overflow:auto;z-index:5;background:white;border-radius:13px;box-shadow:0 5px 20px #0005;padding:13px;display:none}#facilityPanel.open{display:block}#facilityPanel h2{font-size:17px;margin:0 40px 5px 0}#facilityPanel .meta{color:#456456;font-size:12px;margin-bottom:10px}#closePanel{position:absolute;right:10px;top:10px;border:0;border-radius:50%;background:#e9f1eb;height:30px;width:30px;font-size:20px}#farSearch{width:100%;border:1px solid #b8c9be;border-radius:7px;padding:11px;margin:7px 0}#assetList{max-height:34vh;overflow:auto}.asset{padding:10px;border:1px solid #d8e3dc;border-radius:8px;margin:6px 0}.asset button{background:#e5f0e8;color:#126043;border:0;padding:8px;border-radius:7px;margin-top:7px}.asset small{display:block;color:#52675c;margin-top:4px}.assetDetail{background:#f1f7f2;border-radius:9px;padding:11px;margin-top:10px}.assetDetail dl{display:grid;grid-template-columns:110px 1fr;gap:5px;margin:10px 0}.assetDetail dt{font-weight:bold}.assetDetail dd{margin:0;overflow-wrap:anywhere}.assetDetail img{max-width:140px;max-height:120px;object-fit:cover;margin:4px;border-radius:5px}.assetDetail a{display:inline-block;margin:6px 0;color:#126043;font-weight:bold}.muted{color:#5d7165;font-size:12px}.hidden{display:none!important}@media(min-width:850px){#facilityPanel{left:auto;width:440px;right:16px;max-height:82%}#mapWrap{height:calc(100dvh - 163px)}}
</style></head><body>
<header><strong>AMATOLA WATER</strong><small>Form 55 | Facility Asset Verification</small></header>
<div id="auth"><span id="notice">Sign in to access the private asset register.</span><button id="login" class="primary">Sign in</button><button id="logout" class="hidden">Sign out</button></div>
<div id="app" class="hidden"><div id="filters"><label>Scheme<select id="scheme"><option value="">All schemes</option></select></label><label>Facility<select id="facility"><option value="">Select facility</option></select></label></div><div id="mapWrap"><div id="map"></div><button id="gps" aria-label="Find my location" title="My location">◎</button><div id="gpsStatus"></div><section id="facilityPanel" aria-label="Facility and asset details"><button id="closePanel" aria-label="Close facility details">×</button><h2 id="facilityName"></h2><div class="meta" id="facilityMeta"></div><input id="farSearch" placeholder="Search FAR number, type or description" aria-label="Search FAR components"><div id="assetList"></div><div id="assetDetail"></div></section></div></div>
<script>
'use strict';
const CLIENT_ID='StEmFuelJqt2kLlL';
const REDIRECT='https://odwamendile-beep.github.io/form55-asset-verification/AW_FAR_SEARCH_V6_TEST.html';
const BASE='https://services.arcgis.com/C6rxPmErTlCKv9Qe/arcgis/rest/services/AW_Asset_Verification_Field_2026/FeatureServer';
const PORTAL='https://www.arcgis.com';
const $=id=>document.getElementById(id),str=v=>String(v??''),norm=v=>str(v).trim().toLowerCase();
let token=null,expiry=0,facilities=[],components=[],selected=null,view=null,markers=null,Graphic=null,Point=null,attachmentSeq=0,photoUrls=[];
function login(){const state=crypto.randomUUID();sessionStorage.setItem('aw_far_oauth_state',state);location.href=PORTAL+'/sharing/rest/oauth2/authorize?'+new URLSearchParams({client_id:CLIENT_ID,response_type:'token',redirect_uri:REDIRECT,expiration:'120',state});}
$('login').onclick=login;
$('logout').onclick=()=>{sessionStorage.removeItem('aw_far_auth');location.href=REDIRECT;};
function restore(){const h=new URLSearchParams(location.hash.slice(1));if(h.has('access_token')){if(h.get('state')!==sessionStorage.getItem('aw_far_oauth_state'))throw Error('Login state verification failed');token=h.get('access_token');expiry=Date.now()+Number(h.get('expires_in')||0)*1000;sessionStorage.setItem('aw_far_auth',JSON.stringify({token,expiry}));sessionStorage.removeItem('aw_far_oauth_state');history.replaceState(null,'',location.pathname);}else{const saved=JSON.parse(sessionStorage.getItem('aw_far_auth')||'null');if(saved?.expiry>Date.now()+60000){token=saved.token;expiry=saved.expiry;}}}
async function query(layer,params){const r=await fetch(BASE+'/'+layer+'/query',{method:'POST',body:new URLSearchParams({f:'json',token,...params}),cache:'no-store'});if(!r.ok)throw Error('ArcGIS HTTP '+r.status);const j=await r.json();if(j.error)throw Error(j.error.message||'ArcGIS query error');return j;}
async function all(layer){const ids=await query(layer,{where:'1=1',returnIdsOnly:'true'}),res=[];for(let i=0;i<(ids.objectIds||[]).length;i+=150){const j=await query(layer,{objectIds:ids.objectIds.slice(i,i+150).join(','),outFields:'*',returnGeometry:layer===0?'true':'false',outSR:'4326'});res.push(...(j.features||[]).map(f=>({...f.attributes,_geometry:f.geometry})));}return res;}
function id(f){return norm(f.Facility_ID||f.Facility_GlobalID||f.GlobalID);}
function componentFacilityId(a){return norm(a.Facility_ID||a.Facility_GlobalID);}
function assets(f){return components.filter(a=>componentFacilityId(a)===id(f));}
function verified(a){return ['verified','complete','completed'].includes(norm(a.Verification_Status||a.Final_Result))||a.Completion_Flag===1||norm(a.Completion_Flag)==='yes';}
function geo(f){const g=f._geometry;if(g&&Number.isFinite(Number(g.x))&&Number.isFinite(Number(g.y)))return {longitude:Number(g.x),latitude:Number(g.y)};const x=Number(f.Longitude),y=Number(f.Latitude);return Number.isFinite(x)&&Number.isFinite(y)?{longitude:x,latitude:y}:null;}
function schemeFacilities(){return facilities.filter(f=>!$('scheme').value||str(f.Scheme)===$('scheme').value);}
function fillFacilities(){const dropdown=$('facility'),value=selected?id(selected):'';dropdown.replaceChildren(new Option('Select facility',''));for(const f of schemeFacilities().sort((a,b)=>str(a.Facility_Name).localeCompare(str(b.Facility_Name))))dropdown.add(new Option(f.Facility_Name||f.Facility_ID,id(f)));dropdown.value=value;}
function paint(){if(!markers)return;markers.removeAll();for(const f of (selected?[selected]:schemeFacilities())){const p=geo(f);if(!p)continue;const list=assets(f),done=list.filter(verified).length;markers.add(new Graphic({geometry:new Point(p),symbol:{type:'simple-marker',style:'circle',size:8,color:list.length&&done===list.length?'#20864f':done?'#e3a432':'#c34a3d',outline:{color:'#fff',width:1.2}},attributes:{fid:id(f)}}));}}
function zoomTo(list){if(!view)return;const pts=list.map(geo).filter(Boolean);if(!pts.length)return;if(pts.length===1)view.goTo({center:[pts[0].longitude,pts[0].latitude],zoom:17}).catch(()=>{});else view.goTo(pts.map(p=>new Point(p)),{padding:65}).catch(()=>{});}
function clearDetail(){attachmentSeq++;photoUrls.forEach(u=>URL.revokeObjectURL(u));photoUrls=[];$('assetDetail').replaceChildren();}
function chooseFacility(f,zoom){const same=selected&&id(selected)===id(f);selected=same?null:f;clearDetail();$('farSearch').value='';$('facilityPanel').classList.toggle('open',!!selected);if(selected){$('scheme').value=str(selected.Scheme||'');$('facilityName').textContent=selected.Facility_Name||'Facility';renderAssets();}fillFacilities();paint();if(zoom&&selected)zoomTo([selected]);}
function renderAssets(){if(!selected)return;const list=assets(selected),done=list.filter(verified).length;$('facilityMeta').textContent=list.length+' FAR components · '+done+' verified';const term=norm($('farSearch').value),box=$('assetList');box.replaceChildren();const filtered=list.filter(a=>!term||[a.FAR_ID,a.ComponentType,a.AssetName,a.AssetType,a.AssetGroupName,a.Building,a.Floor,a.Room].some(v=>norm(v).includes(term)));if(!filtered.length){box.textContent='No matching FAR components.';return;}for(const a of filtered){const card=document.createElement('div');card.className='asset';const title=document.createElement('strong');title.textContent=a.FAR_ID||'FAR number unavailable';const sub=document.createElement('small');sub.textContent=[a.ComponentType||a.AssetType||a.AssetName||'Component',a.Building&&'Building '+a.Building,a.Floor&&'Floor '+a.Floor,a.Room&&'Room '+a.Room].filter(Boolean).join(' · ');const btn=document.createElement('button');btn.textContent='View details and verification';btn.onclick=()=>openAsset(a);card.append(title,sub,btn);box.append(card);}}
function addText(parent,tag,text){const e=document.createElement(tag);e.textContent=str(text);parent.append(e);return e;}
async function openAsset(a){clearDetail();const seq=attachmentSeq,box=$('assetDetail');box.className='assetDetail';addText(box,'h3','FAR '+(a.FAR_ID||'Asset details'));const dl=document.createElement('dl');for(const [label,value] of [['Description',a.AssetName||a.AssetGroupName],['Component',a.ComponentType||a.AssetType],['Building',a.Building],['Floor',a.Floor],['Room',a.Room],['Verification',a.Verification_Status||a.Final_Result||a.Completion_Flag]]){addText(dl,'dt',label);addText(dl,'dd',value||'Not recorded');}box.append(dl);if(a.Survey123_Edit_URL){const link=document.createElement('a');link.href=a.Survey123_Edit_URL;link.target='_blank';link.rel='noopener';link.textContent='Open existing Survey123 verification';box.append(link);}else addText(box,'p','No existing Survey123 edit link is recorded for this asset.');const note=addText(box,'p','Checking historical photographs…');note.className='muted';const oid=a.OBJECTID??a.ObjectID;if(oid==null){note.textContent='Photo lookup unavailable: no Object ID.';return;}try{const r=await fetch(BASE+'/1/'+encodeURIComponent(oid)+'/attachments',{method:'POST',body:new URLSearchParams({f:'json',token})});const j=await r.json();if(j.error)throw Error(j.error.message);if(seq!==attachmentSeq)return;const imgs=(j.attachmentInfos||[]).filter(i=>/^image\//.test(i.contentType||'')||/\.(jpg|jpeg|png|webp)$/i.test(i.name||''));note.textContent=imgs.length?imgs.length+' historical photo(s) on this record':'No photo attachments on this component record.';for(const i of imgs){const res=await fetch(BASE+'/1/'+encodeURIComponent(oid)+'/attachments/'+i.id+'?'+new URLSearchParams({token}));if(!res.ok)throw Error('Photo HTTP '+res.status);const url=URL.createObjectURL(await res.blob());if(seq!==attachmentSeq){URL.revokeObjectURL(url);return;}photoUrls.push(url);const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener';const img=document.createElement('img');img.src=url;img.alt=i.name||'Historical photo';link.append(img);box.append(link);}}catch(e){if(seq===attachmentSeq)note.textContent='Photos could not be loaded: '+e.message;} }
$('scheme').onchange=()=>{selected=null;clearDetail();$('facilityPanel').classList.remove('open');fillFacilities();paint();zoomTo(schemeFacilities());};
$('facility').onchange=()=>{const f=facilities.find(f=>id(f)===$('facility').value);if(f)chooseFacility(f,true);else if(selected)chooseFacility(selected,false);};
$('farSearch').oninput=renderAssets;
$('closePanel').onclick=()=>{if(selected)chooseFacility(selected,false);};
$('gps').onclick=()=>{const status=$('gpsStatus');status.style.display='block';status.textContent='Locating…';if(!navigator.geolocation){status.textContent='GPS not supported.';return;}navigator.geolocation.getCurrentPosition(p=>{status.textContent='Position located';view?.goTo({center:[p.coords.longitude,p.coords.latitude],zoom:16}).catch(()=>{});},e=>{status.textContent='GPS: '+e.message;},{enableHighAccuracy:true,timeout:15000});};
function initMap(){return new Promise((resolve,reject)=>{require(['esri/Map','esri/views/MapView','esri/layers/GraphicsLayer','esri/Graphic','esri/geometry/Point'],(Map,MapView,GraphicsLayer,G,P)=>{Graphic=G;Point=P;markers=new GraphicsLayer({title:'Facilities'});view=new MapView({container:'map',map:new Map({basemap:'satellite',layers:[markers]}),center:[27.3,-32.9],zoom:8,popupEnabled:false});view.on('click',event=>{let best=null,dist=26*26;markers.graphics.forEach(g=>{const s=view.toScreen(g.geometry);if(!s)return;const d=(s.x-event.x)**2+(s.y-event.y)**2;if(d<=dist){best=g;dist=d;}});if(best){const f=facilities.find(f=>id(f)===best.attributes.fid);if(f)chooseFacility(f,false);}});view.when(resolve,reject);},reject);});}
async function start(){try{restore();if(!token||expiry<=Date.now()+60000)return;$('login').classList.add('hidden');$('logout').classList.remove('hidden');$('notice').textContent='Loading asset register…';[facilities,components]=await Promise.all([all(0),all(1)]);for(const s of [...new Set(facilities.map(f=>str(f.Scheme)).filter(Boolean))].sort())$('scheme').add(new Option(s,s));$('app').classList.remove('hidden');fillFacilities();await initMap();paint();$('notice').textContent=facilities.length+' facilities loaded';}catch(e){$('notice').textContent='Could not load: '+e.message;console.error(e);}}
start();
</script></body></html>
