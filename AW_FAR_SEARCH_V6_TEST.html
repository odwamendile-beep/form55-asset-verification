<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://js.arcgis.com/4.32/esri/themes/light/main.css">
<script src="https://js.arcgis.com/4.32/"></script>
<style>
:root{font-family:Arial,sans-serif;color:#18323a;background:#f2f5f6}
*{box-sizing:border-box}
body{margin:0}
header{background:#07566b;color:white;padding:16px 18px}
header h1{font-size:23px;margin:0}
header p{margin:6px 0 0;font-size:13px}
main{max-width:1100px;margin:auto;padding:14px}
.panel{background:white;border-radius:13px;padding:15px;margin-bottom:13px;box-shadow:0 2px 9px #0001}
button,select,input{font:inherit}
button{border:0;border-radius:9px;background:#087f91;color:white;padding:12px;cursor:pointer}
button:disabled{opacity:.5}

.aw-teach-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}

#awVoiceSaved{font-size:11px;margin-top:5px}
#awVoiceSaved button{font-size:10px;padding:3px 6px;margin-left:6px}
@media(max-width:600px){#map{height:440px}.aw-map-heading{align-items:flex-start}}
</style>

<body>
<header>
<h1>AW FAR SEARCH — V6.1 TEST</h1>

</header>
<main>
<section class="panel">

<script>
const CLIENT_ID="StEmFuelJqt2kLlL";
const REDIRECT="https://odwamendile-beep.github.io/form55-asset-verification/AW_FAR_SEARCH_V6_TEST.html";
const BASE="https://services.arcgis.com/C6rxPmErTlCKv9Qe/arcgis/rest/services/AW_Asset_Verification_Field_2026/FeatureServer";
const PORTAL="https://www.arcgis.com";
let token=null,expiry=0,facilities=[],components=[],selected=null;
let view=null,graphicsLayer=null,Graphic=null,Point=null;
const el=id=>document.getElementById(id);
const clean=v=>String(v??"");
const norm=v=>clean(v).trim().toLowerCase();
const esc=v=>clean(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isVerified=a=>{
  const s=norm(a.Verification_Status);
  return ["verified","complete","completed"].includes(s) ||
         a.Completion_Flag===1 ||
         norm(a.Completion_Flag)==="yes";
};
function signIn(){
 const state=crypto.randomUUID();
 sessionStorage.setItem("aw_far_oauth_state",state);
 const q=new URLSearchParams({
  client_id:CLIENT_ID,response_type:"token",
  redirect_uri:REDIRECT,expiration:"120",state
 });
 location.href=PORTAL+"/sharing/rest/oauth2/authorize?"+q;
}
el("login").onclick=signIn;
el("logout").onclick=()=>{
 token=null;expiry=0;sessionStorage.removeItem("aw_far_auth");
 location.href=REDIRECT;
};
function restore(){
 const hash=new URLSearchParams(location.hash.slice(1));
 if(hash.has("access_token")){
  const expected=sessionStorage.getItem("aw_far_oauth_state");
  if(!expected||expected!==hash.get("state")){
   el("notice").textContent="Login state verification failed. Please sign in again.";
   history.replaceState(null,"",location.pathname);
   return;
  }
  token=hash.get("access_token");
  expiry=Date.now()+Number(hash.get("expires_in")||0)*1000;
  sessionStorage.setItem("aw_far_auth",JSON.stringify({token,expiry}));
  sessionStorage.removeItem("aw_far_oauth_state");
  history.replaceState(null,"",location.pathname);
 }else{
  try{
   const saved=JSON.parse(sessionStorage.getItem("aw_far_auth")||"null");
   if(saved&&saved.expiry>Date.now()+60000){
    token=saved.token;expiry=saved.expiry;
   }
  }catch(e){}
 }
}
async function query(layer,params){
 const body=new URLSearchParams({f:"json",token,...params});
 const response=await fetch(BASE+"/"+layer+"/query",{
  method:"POST",body,cache:"no-store"
 });
 if(!response.ok)throw Error("ArcGIS HTTP "+response.status);
 const data=await response.json();
 if(data.error)throw Error(data.error.message);
 return data;
}
async function fetchAll(layer,fields){
 const ids=await query(layer,{where:"1=1",returnIdsOnly:"true"});
 const keys=ids.objectIds||[],out=[];
 for(let i=0;i<keys.length;i+=150){
  const data=await query(layer,{
   objectIds:keys.slice(i,i+150).join(","),
   outFields:fields,returnGeometry:"true"
  });
  
  out.push(...(data.features||[]).map(f=>({
   ...f.attributes,
   __hostedGeometry: layer===0 ? f.geometry : null
  })));

 }
 return out;
}
function filteredFacilities(){
 const scheme=el("scheme").value;
 const term=norm(el("facilitySearch").value);
 return facilities.filter(f=>
  (!scheme||f.Scheme===scheme)&&
  (!term||norm(f.Facility_Name).includes(term))
 );
}
function facilityAssets(f){
 return components.filter(a=>clean(a.Facility_ID)===clean(f.Facility_ID));
}
function status(f){
 const arr=facilityAssets(f),done=arr.filter(isVerified).length;
 return {total:arr.length,done,
  color:arr.length&&done===arr.length?"#198754":done>0?"#ef8b23":"#c63838"};
}
function renderFacilities(){
 const visible=filteredFacilities();
 const select=el("facility");
 select.replaceChildren(new Option("Select a facility",""));
 visible.sort((a,b)=>clean(a.Facility_Name).localeCompare(clean(b.Facility_Name)));
 for(const f of visible){
  select.add(new Option(f.Facility_Name,f.Facility_ID));
 }
 if(selected&&visible.some(f=>f.Facility_ID===selected.Facility_ID))
  select.value=selected.Facility_ID;
 else selected=null;
 renderMap(visible);
 renderAssets();
}
function selectFacility(id,zoom=false){
 selected=facilities.find(f=>clean(f.Facility_ID)===clean(id))||null;
 if(selected){
  el("scheme").value=selected.Scheme||"";
  el("facilitySearch").value="";
 }
 renderFacilities();
 if(zoom && selected) awV6ZoomFacility(selected);
}
function renderAssets(){
 const target=el("assets");
 target.replaceChildren();
 if(typeof window.awRefreshMapPanel==="function")
  window.awRefreshMapPanel();
 if(!selected){
  el("selectedTitle").textContent="Select a facility";
  el("progress").textContent="";
  target.textContent="Tap a facility pin or select a facility above.";
  return;
 }
 const arr=facilityAssets(selected);
 const done=arr.filter(isVerified).length;
 el("selectedTitle").textContent=selected.Facility_Name;
 el("progress").textContent=done+" of "+arr.length+" components verified";
 const term=norm(el("farSearch").value);
 const matches=arr.filter(a=>[
  a.FAR_ID,a.ComponentType,a.AssetName,a.Building,a.Floor,a.Room
 ].some(v=>norm(v).includes(term)));
 if(!matches.length){target.textContent="No matching components.";return;}
 for(const a of matches){
  const card=document.createElement("div");
  card.className="asset";
  const title=document.createElement("strong");
  title.textContent=a.FAR_ID||"No FAR number";
  const desc=document.createElement("div");
  desc.textContent=a.ComponentType||a.AssetName||"Component";
  const info=document.createElement("small");
  info.textContent="Building: "+(a.Building||"-")+
   " | Floor: "+(a.Floor||"-")+
   " | Room: "+(a.Room||"-")+
   " | "+(a.Verification_Status||"PENDING");
  card.append(title,desc,info);
  if(a.Survey123_Edit_URL){
   const link=document.createElement("a");
   link.href=a.Survey123_Edit_URL;
   link.textContent="Verify Asset (existing form)";
   card.append(link);
  }
  target.append(card);
 }
}
function renderMap(list){
 if(!graphicsLayer||!Graphic||!Point)return;
 graphicsLayer.removeAll();
 for(const f of list){
  
  // AW_V3_LIVE_GEOMETRY_FIX
  const geometry = f.__hostedGeometry;
  const lat = Number(geometry?.y);
  const lon = Number(geometry?.x);

  if(!Number.isFinite(lat)||!Number.isFinite(lon))continue;
  const s=status(f);
  graphicsLayer.add(new Graphic({
   geometry:new Point({longitude:lon,latitude:lat}),
   symbol:{type:"simple-marker",style:"circle",size:12,
    color:s.color,outline:{color:"white",width:1.5}},
   attributes:{fid:f.Facility_ID}
  }));
 }
}
async function initMap(){
 return new Promise((resolve,reject)=>{
  require([
   "esri/Map","esri/views/MapView","esri/layers/GraphicsLayer",
   "esri/Graphic","esri/geometry/Point","esri/layers/FeatureLayer"
  ],(Map,MapView,GraphicsLayer,G,P,FeatureLayer)=>{
   Graphic=G;Point=P;
   graphicsLayer=new GraphicsLayer();
   const map=new Map({basemap:"satellite",layers:[graphicsLayer]});
   view=new MapView({container:"map",map,center:[27.3,-32.9],zoom:8});

// AW_APPROVED_CONTEXT_LAYERS_V3

const awContextBase =
 "https://services.arcgis.com/C6rxPmErTlCKv9Qe/" +
 "arcgis/rest/services/" +
 "Water_Quality_Dashboard_Context/FeatureServer/";

const awBulkPipelines = new FeatureLayer({
 url: awContextBase + "4",
 title: "AW Bulk Pipelines",
 visible: true,
 popupEnabled: true
});


const awSchemeBoundaries = new FeatureLayer({
 url: awContextBase + "8",
 title: "Scheme Boundaries",
 visible: true,
 popupEnabled: false,
 labelsVisible: false,
 renderer: {
  type: "simple",
  symbol: {
   type: "simple-fill",
   style: "none",
   outline: {
    color: [255,255,255,1],
    width: 2
   }
  }
 }
});


// Boundaries below pipelines; facility pins above both.
map.addMany([
 awSchemeBoundaries,
 awBulkPipelines
], 0);

// Add visibility controls inside ArcGIS MapView.

// AW V3 - DYNAMIC MAP LEGEND


// AW_MAP_PANEL_V4 - unified map controls
const awPanel = document.createElement("div");

awPanel.style.cssText =
 "width:190px;max-width:calc(100vw - 45px);" +
 "box-sizing:border-box;background:#fff;color:#183153;" +
 "border:1px solid #dce4ec;border-radius:12px;" +
 "box-shadow:0 5px 20px #0003;padding:13px;" +
 "font:13px Arial,sans-serif;";

awPanel.innerHTML = `
 <div style="display:flex;align-items:center;
 justify-content:space-between;margin-bottom:12px">
  <strong style="font-size:14px">Map controls</strong>
  <button id="awCollapse" type="button"
   aria-expanded="true"
   style="border:0;background:#eef2f6;border-radius:6px;
   padding:5px 9px;cursor:pointer">−</button>
 </div>

 <div id="awPanelBody">
  <div style="font-size:10px;color:#64748b;
   letter-spacing:1px;margin-bottom:6px">BASEMAP</div>

  <select id="awBasemap" aria-label="Basemap"
   style="width:100%;box-sizing:border-box;padding:9px;
   border:1px solid #dbe3ec;border-radius:7px;
   background:#f8fafc;color:#183153">
   <option value="satellite">Satellite</option>
   <option value="hybrid">Satellite + Labels</option>
   <option value="streets-vector">Street</option>
  </select>

  <div style="height:1px;background:#e5eaf0;
   margin:13px 0"></div>

  <strong style="display:block;margin-bottom:11px">Legend</strong>

  <div style="display:grid;
   grid-template-columns:25px 1fr 20px;
   align-items:center;gap:8px;margin-bottom:12px">
   <span style="width:17px;height:12px;
    border:2px solid #b7c3d0;border-radius:2px"></span>
   <span>Schemes</span>
   <input id="awSchemes" type="checkbox" checked
    aria-label="Show schemes" style="margin:0">
  </div>

  <div style="display:grid;
   grid-template-columns:25px 1fr 20px;
   align-items:center;gap:8px;margin-bottom:12px">
   <span style="width:12px;height:12px;
    background:#c63838;border-radius:50%;
    border:2px solid #fff;
    box-shadow:0 0 0 1px #c63838"></span>
   <span>Facilities</span>
   <input id="awFacilities" type="checkbox" checked
    aria-label="Show facilities" style="margin:0">
  </div>

  <div style="display:grid;
   grid-template-columns:25px 1fr 20px;
   align-items:center;gap:8px">
   <span style="width:20px;height:3px;
    background:#d9bd00;border-radius:3px"></span>
   <span>Pipelines</span>
   <input id="awPipelines" type="checkbox" checked
    aria-label="Show pipelines" style="margin:0">
  </div>

  <div style="height:1px;background:#e5eaf0;
   margin:13px 0"></div>

  <div style="font-size:10px;color:#64748b;
   letter-spacing:1px;margin-bottom:7px">
   CURRENT VIEW
  </div>

  <div id="awContext" aria-live="polite"
   style="background:#f2f6fa;border-radius:8px;
   padding:11px;line-height:1.5">
   Loading facilities...
  </div>
 </div>
`;

// AW_FACILITY_INTERACTION_V5
view.ui.add(awPanel, "top-right");

awPanel.querySelector("#awPanelBody").style.display="none";
awPanel.querySelector("#awCollapse").textContent="+";
awPanel.querySelector("#awCollapse")
 .setAttribute("aria-expanded","false");


 // AW_V61_FLOATING_CONTROLS
 // Compact Current View sits at bottom-right; controls start collapsed.
 const awCurrentView = awPanel.querySelector("#awContext");
 if(!awCurrentView)throw Error("Current View missing");
 const awCurrentViewPanel=document.createElement("div");
 awCurrentViewPanel.style.cssText="background:rgba(255,255,255,.97);color:#183153;border:1px solid #dce4ec;border-radius:8px;padding:6px 8px;box-shadow:0 2px 9px #0002;width:145px;max-width:40vw;box-sizing:border-box;font:10px Arial,sans-serif;";
 awCurrentView.style.cssText="line-height:1.25;overflow-wrap:anywhere;font-size:10px";
 awCurrentViewPanel.appendChild(awCurrentView);
 view.ui.add(awCurrentViewPanel,"bottom-right");
 awPanel.style.cssText="width:148px;max-width:42vw;box-sizing:border-box;background:rgba(255,255,255,.97);color:#183153;border:1px solid #dce4ec;border-radius:8px;box-shadow:0 2px 9px #0002;padding:7px;font:10px Arial,sans-serif;";
 awPanel.querySelector("strong").style.fontSize="11px";
 awPanel.querySelector("#awPanelBody").style.display="none";
 awPanel.querySelector("#awCollapse").textContent="+";
 awPanel.querySelector("#awCollapse").setAttribute("aria-expanded","false");

 // AW_V61_VOICE_NAVIGATION: page toolbar, not a map widget.
 const awVoiceButton=el("awVoiceButton"),awVoiceStatus=el("awVoiceStatus"),awVoiceChoices=el("awVoiceChoices");
 const awSpeechAPI=window.SpeechRecognition||window.webkitSpeechRecognition;
 const awAliasesDefault={"now on":"Nahoon","nah horn":"Nahoon","nahoon":"Nahoon","lion":"Laing","laying":"Laing","lying":"Laing","sandy lee":"Sandile","sandily":"Sandile","mini ameni":"Mnyameni","many a many":"Mnyameni","rooie krantz":"Rooikrantz","roy krantz":"Rooikrantz","debby":"Debe"};
 const awAliasKey="aw_form55_voice_aliases_v61";
 let awAliases={};
 try{const stored=JSON.parse(localStorage.getItem(awAliasKey)||"{}");if(stored&&typeof stored==="object"&&!Array.isArray(stored))awAliases=stored;}catch(e){}
 function awNormal(v){return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/&/g," and ").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();}
 const awStop=new Set(["show","find","take","please","open","navigate","search","facility","facilities","scheme","the","for","and","assets","asset","components","component","to","go","me","water","treatment","works","station","plant","pump","pumping","inside","located","want","need","there","here","with","at","in"]);
 function awCleanCommand(v){return awNormal(v).split(" ").filter(w=>w&&!awStop.has(w)).join(" ");}
 function awEditDistance(a,b){const x=Array.from(a),y=Array.from(b),dp=Array.from({length:y.length+1},(_,i)=>i);for(let i=1;i<=x.length;i++){let prev=dp[0];dp[0]=i;for(let j=1;j<=y.length;j++){const old=dp[j];dp[j]=Math.min(dp[j]+1,dp[j-1]+1,prev+(x[i-1]===y[j-1]?0:1));prev=old;}}return dp[y.length];}
 function awCatalog(){return [...Array.from(el("scheme").options).filter(o=>o.value).map(o=>({kind:"scheme",name:o.textContent,value:o.value})),...facilities.map(f=>({kind:"facility",name:f.Facility_Name,value:clean(f.Facility_ID)}))];}
 function awResolveAlias(spoken){let phrase=awCleanCommand(spoken);const all={...awAliasesDefault,...awAliases};const aliases=Object.entries(all).sort((a,b)=>b[0].length-a[0].length);for(const [from,to] of aliases){const term=awNormal(from);if(term && (phrase===term||phrase.includes(" "+term+" ")||phrase.startsWith(term+" ")||phrase.endsWith(" "+term))){phrase=phrase.replace(new RegExp("(^| )"+term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?= |$)","g")," "+awNormal(to)).trim();}}return phrase;}
 function awScore(query,name){const q=awResolveAlias(query),n=awCleanCommand(name);if(!q||!n)return 0;if(q===n)return 100;if(q.includes(n)&&n.length>=4)return 95;if(n.includes(q)&&q.length>=4)return 86;const qt=q.split(" "),nt=n.split(" ");const hits=nt.filter(t=>qt.includes(t));const tokenScore=hits.length?Math.round(60*hits.length/nt.length+20*hits.length/qt.length):0;const distance=awEditDistance(q,n),ratio=1-distance/Math.max(q.length,n.length);return Math.max(tokenScore,ratio>=.72?Math.round(ratio*80):0);}
 function awSetStatus(t){awVoiceStatus.textContent=t;}
 function awShowChoices(items,caption){awVoiceChoices.replaceChildren();const lead=document.createElement("div");lead.textContent=caption;awVoiceChoices.append(lead);for(const item of items.slice(0,6)){const b=document.createElement("button");b.type="button";b.textContent=(item.kind==="scheme"?"Scheme: ":"Facility: ")+item.name;b.onclick=()=>{awVoiceChoices.classList.add("hidden");awNavigate(item);};awVoiceChoices.append(b);}awVoiceChoices.classList.remove("hidden");}
 function awNavigate(item){if(item.kind==="scheme"){el("facilitySearch").value="";el("scheme").value=item.value;awV6ApplyFilter();awSetStatus("Showing scheme: "+item.name);}else{selectFacility(item.value,true);awSetStatus("Selected facility: "+item.name);}}
 function awVoiceHandle(transcripts){const entries=awCatalog();let ranked=[];for(const transcript of transcripts){for(const entry of entries){const score=awScore(transcript,entry.name);if(score>=57){const existing=ranked.find(r=>r.kind===entry.kind&&r.value===entry.value);if(existing)existing.score=Math.max(existing.score,score);else ranked.push({...entry,score});}}}ranked.sort((a,b)=>b.score-a.score|| (a.kind==="scheme"?-1:1));const heard=transcripts[0]||"";el("awVoicePhrase").value=heard;if(!ranked.length){awSetStatus('Heard: "'+heard+'" — no match');awShowChoices(entries.filter(e=>e.kind==="scheme"),"No confident match. Choose a scheme or teach this phrase below.");return;}const best=ranked[0];const near=ranked.filter(x=>x.score>=best.score-8);const schemeExact=near.find(x=>x.kind==="scheme"&&x.score>=95);if(schemeExact){awVoiceChoices.classList.add("hidden");awNavigate(schemeExact);return;}if(near.length>1){awSetStatus('Heard: "'+heard+'"');awShowChoices(near,"Several matches. Choose the correct one:");return;}if(best.score>=72){awVoiceChoices.classList.add("hidden");awNavigate(best);}else{awSetStatus('Heard: "'+heard+'"');awShowChoices(ranked,"Please confirm the matching name:");}}
 function awPopulateTargets(){const target=el("awVoiceTarget");target.replaceChildren(new Option("Select correct name",""));for(const entry of awCatalog().sort((a,b)=>a.kind.localeCompare(b.kind)||a.name.localeCompare(b.name))){const option=new Option((entry.kind==="scheme"?"Scheme: ":"Facility: ")+entry.name,entry.name);target.add(option);}}
 function awRenderSaved(){const div=el("awVoiceSaved");div.replaceChildren();const entries=Object.entries(awAliases);if(!entries.length){div.textContent="Custom phrases are saved in this browser only.";return;}for(const [from,to] of entries){const line=document.createElement("div");line.textContent=from+" → "+to;const remove=document.createElement("button");remove.textContent="Remove";remove.type="button";remove.onclick=()=>{delete awAliases[from];localStorage.setItem(awAliasKey,JSON.stringify(awAliases));awRenderSaved();};line.append(remove);div.append(line);}}
 el("awVoiceTeach").onclick=()=>{const phrase=awNormal(el("awVoicePhrase").value),target=el("awVoiceTarget").value;if(!phrase||!target){awSetStatus("Enter the words Chrome heard and select the correct name.");return;}awAliases[phrase]=target;try{localStorage.setItem(awAliasKey,JSON.stringify(awAliases));awSetStatus('Saved: "'+phrase+'" → '+target);}catch(e){awSetStatus("Could not save this phrase in browser storage.");}awRenderSaved();};
 window.awV61PopulateTargets=awPopulateTargets;awPopulateTargets();awRenderSaved();
 if(!awSpeechAPI){awVoiceButton.disabled=true;awSetStatus("Speech recognition not supported. Use Chrome or Edge.");}else{
 const recognition=new awSpeechAPI();recognition.lang="en-ZA";recognition.interimResults=false;recognition.maxAlternatives=5;recognition.continuous=false;
 awVoiceButton.onclick=()=>{try{recognition.start();}catch(e){awSetStatus("Microphone: "+e.message);}};
 recognition.onstart=()=>{awVoiceButton.textContent="🎤 Listening...";awSetStatus("Say a scheme or facility name");};
 recognition.onresult=event=>{const alternatives=Array.from(event.results[0]||[]).map(r=>r.transcript).filter(Boolean);awVoiceHandle(alternatives);};
 recognition.onerror=event=>awSetStatus("Microphone: "+event.error);
 recognition.onend=()=>{awVoiceButton.textContent="🎤 Voice search";};
 }

 const awControl = id => awPanel.querySelector("#" + id);

awControl("awBasemap").onchange = function(){
 map.basemap = this.value;
};

awControl("awSchemes").onchange = function(){
 awSchemeBoundaries.visible = this.checked;
};

awControl("awFacilities").onchange = function(){
 graphicsLayer.visible = this.checked;
 awRefreshMapPanel();
};

awControl("awPipelines").onchange = function(){
 awBulkPipelines.visible = this.checked;
};

awControl("awCollapse").onclick = function(){
 const body = awControl("awPanelBody");
 const collapse = body.style.display !== "none";
 body.style.display = collapse ? "none" : "block";
 this.textContent = collapse ? "+" : "−";
 this.setAttribute("aria-expanded",String(!collapse));
};


function awRefreshMapPanel(){
 const target = document.getElementById("awContext");
 if(!target || !view) return;

 target.replaceChildren();

 const header = document.createElement("div");
 header.style.cssText =
  "display:flex;align-items:center;" +
  "justify-content:space-between;gap:8px;" +
  "margin-bottom:7px";

 const heading = document.createElement("strong");
 heading.textContent = "Current view";
 heading.style.fontSize = "10px";

 const refresh = document.createElement("button");
 refresh.type = "button";
 refresh.textContent = "↻";
 refresh.title = "Clear selected facility";
 refresh.setAttribute("aria-label","Clear selected facility");
 refresh.style.cssText =
  "border:1px solid #dbe3ec;background:white;" +
  "border-radius:6px;padding:1px 5px;" +
  "color:#183153;cursor:pointer;font-size:12px";

 refresh.onclick = awClearFacilitySelection;

 header.append(heading,refresh);
 target.appendChild(header);

 function addLine(value,css){
  const div = document.createElement("div");
  div.textContent = value;
  if(css) div.style.cssText = css;
  target.appendChild(div);
 }

 if(selected){
  const count = facilityAssets(selected).length;

  addLine(count.toLocaleString()+" FAR components",
   "font-size:12px;font-weight:bold;margin-bottom:3px");

  addLine(selected.Facility_Name || "Selected facility",
   "font-size:10px;color:#526577;overflow-wrap:anywhere");

  return;
 }

 const extent = view.extent;

 const visible = graphicsLayer.visible && extent
  ? graphicsLayer.graphics.filter(g =>
     g.geometry && extent.contains(g.geometry)
    )
  : [];

 addLine(
  visible.length.toLocaleString() +
  (visible.length===1 ? " facility visible" : " facilities visible"),
  "font-size:12px;font-weight:bold;margin-bottom:3px"
 );

 if(visible.length===1){
  const id = visible[0].attributes?.fid;
  const facility = facilities.find(f =>
   clean(f.Facility_ID)===clean(id)
  );

  if(facility){
   addLine(facility.Facility_Name,
    "font-size:10px;color:#526577;" +
    "border-top:1px solid #e5eaf0;" +
    "padding-top:6px;overflow-wrap:anywhere");
  }
 }
}

function awClearFacilitySelection(){
 selected = null;

 el("facilitySearch").value = "";
 el("farSearch").value = "";
 el("scheme").value = "";

 renderFacilities();
 awRefreshMapPanel();

 // Map extent, zoom and centre remain unchanged.
}

window.awRefreshMapPanel = awRefreshMapPanel;

view.watch("stationary",function(stationary){
 if(stationary) awRefreshMapPanel();
});

graphicsLayer.graphics.on("change",function(){
 if(view.stationary) awRefreshMapPanel();
});

view.when(awRefreshMapPanel);

console.log("AW approved map layers initialized.");




   view.on("click",async event=>{
    const hit=await view.hitTest(event);
    const found=hit.results.find(r=>r.graphic?.layer===graphicsLayer);
    if(found)selectFacility(found.graphic.attributes.fid,false);
   });
   view.when(resolve,reject);
  },reject);
 });
}
async function start(){
 restore();
 if(!token||expiry<=Date.now()+60000)return;
 el("login").classList.add("hidden");
 el("logout").classList.remove("hidden");
 el("notice").textContent="Signed in. Loading facilities and FAR components...";
 try{
  [facilities,components]=await Promise.all([
   fetchAll(0,"Facility_ID,Facility_Name,Scheme,Latitude,Longitude"),
   fetchAll(1,"Facility_ID,FAR_ID,ComponentType,AssetName,Building,Floor,Room,Verification_Status,Completion_Flag,Survey123_Edit_URL")
  ]);
  el("facilityCount").textContent=facilities.length;
  el("assetCount").textContent=components.length;
  el("verifiedCount").textContent=components.filter(isVerified).length;
  const schemes=[...new Set(facilities.map(f=>f.Scheme).filter(Boolean))].sort();
  for(const s of schemes)el("scheme").add(new Option(s,s));
  el("workspace").classList.remove("hidden");
  el("notice").textContent="Online asset register loaded.";
  await initMap();
  if(window.awV61PopulateTargets)window.awV61PopulateTargets();
  renderFacilities();
 }catch(e){
  el("notice").textContent="Loading failed: "+e.message;
  console.error(e);
 }
}

// AW_V6_FILTER_NAVIGATION

function awV6ZoomFacility(f){
 if(!view || !f) return;

 const g=f.__hostedGeometry;
 const lon=Number(g?.x);
 const lat=Number(g?.y);

 if(!Number.isFinite(lon) || !Number.isFinite(lat))return;

 view.goTo({
  center:[lon,lat],
  zoom:17
 }).catch(e=>{
  if(e?.name!=="AbortError")console.warn(e);
 });
}

function awV6ZoomFiltered(){
 if(!view || !graphicsLayer)return;

 const list=graphicsLayer.graphics.toArray();

 if(!list.length)return;

 if(list.length===1){
  const id=list[0].attributes?.fid;
  const f=facilities.find(x=>clean(x.Facility_ID)===clean(id));
  if(f)awV6ZoomFacility(f);
  return;
 }

 view.goTo(list,{padding:55}).catch(e=>{
  if(e?.name!=="AbortError")console.warn(e);
 });
}

function awV6ApplyFilter(){
 renderFacilities();
 awV6ZoomFiltered();
}

el("scheme").onchange=awV6ApplyFilter;
el("facilitySearch").oninput=awV6ApplyFilter;
el("facility").onchange=e=>selectFacility(e.target.value,true);
el("farSearch").oninput=renderAssets;
start();
